# Configuração do Cloudflare Pages (site + funções + banco KV)
name = "onshopcell"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

# Banco KV com o catálogo, as fotos do painel e o bloqueio de tentativas de login.
# O id é criado uma vez com: npx wrangler kv namespace create LOJA
[[kv_namespaces]]
binding = "LOJA"
id = "SUBSTITUIR_PELO_ID_DO_KV"
